<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：窄屏底栏靠 env(safe-area-inset-bottom) 避开 iPhone 底部横条，
         不声明的话这个变量恒为 0（「添加到主屏幕」后底栏会被 home indicator 压住） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="字体授权与水印追溯工作台：字体文件不上传，水印嵌入与泄露追溯全部在本机浏览器完成，云端只存哈希与订单号。" />
    <meta name="theme-color" content="#102d50" />
    <!-- 手机「添加到主屏幕」后图标下方的名字（不设则回落 <title>，会被截断） -->
    <meta name="apple-mobile-web-app-title" content="文镇 TypeFlow" />
    <meta property="og:title" content="文镇 TypeFlow · 字体授权工作台" />
    <meta property="og:description" content="零上传的字体授权管理与水印追溯——字体不出本机，云端只存哈希。" />
    <meta property="og:type" content="website" />
    <!-- 站点图标 = 厂牌 logo：SVG 给桌面标签页（矢量最清晰），PNG 兜底 + 手机主屏 -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>文镇 TypeFlow · 字体授权工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
